<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"></head><body>
<title>WeekWise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* ================= tokens ================= */
:root {
  color-scheme: light;
  --bg:#f6f6f9; --surface:#ffffff; --surface-2:#f0f0f4; --surface-3:#e4e4ea;
  --border:#e3e3ea; --card-border:transparent;
  --text:#1d1d24; --text-2:#5f5f6b; --text-3:#9797a3;
  --ink:#23232b; --on-ink:#ffffff;
  --cat-study:#6366f1; --cat-study-soft:#e9e9fd; --cat-study-deep:#4548c8;
  --cat-work:#0d9488; --cat-work-soft:#ddf1ee; --cat-work-deep:#0b6e66;
  --cat-personal:#d97706; --cat-personal-soft:#f9ecda; --cat-personal-deep:#9d5804;
  --success:#188647; --success-soft:#e0f2e7;
  --danger:#c93030; --danger-soft:#fbe9e9;
  --sw-0:#6366f1; --sw-1:#0ea5e9; --sw-2:#0d9488; --sw-3:#16a34a;
  --sw-4:#ca8a04; --sw-5:#d97706; --sw-6:#dc2626; --sw-7:#db2777;
  --sw-8:#9333ea; --sw-9:#64748b; --sw-10:#7c3aed; --sw-11:#0891b2;
  --shadow:0 1px 2px rgb(24 24 36 / .05), 0 4px 14px rgb(24 24 36 / .06);
  --sheet-shadow:0 -8px 40px rgb(24 24 36 / .18);
  --r-sm:7px; --r-md:11px; --r-lg:15px;
  --font-ui:"Instrument Sans", "Segoe UI", -apple-system, system-ui, sans-serif;
  --font-display:"Sora", "Segoe UI", -apple-system, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg:#141419; --surface:#1d1d23; --surface-2:#26262e; --surface-3:#32323c;
    --border:#2e2e37; --card-border:#2e2e37;
    --text:#ebebf0; --text-2:#a5a5b1; --text-3:#71717d;
    --ink:#e8e8ef; --on-ink:#1a1a20;
    --cat-study:#6366f1; --cat-study-soft:#2c2c52; --cat-study-deep:#a5a7f9;
    --cat-work:#0d9488; --cat-work-soft:#123531; --cat-work-deep:#4fd4c5;
    --cat-personal:#d97706; --cat-personal-soft:#3f2d12; --cat-personal-deep:#f3a94e;
    --success:#3fbf74; --success-soft:#15321f;
    --danger:#ef6a6a; --danger-soft:#3d1d1d;
    --sw-0:#8b8df8; --sw-1:#38bdf8; --sw-2:#2dd4bf; --sw-3:#4ade80;
    --sw-4:#facc15; --sw-5:#fb923c; --sw-6:#f87171; --sw-7:#f472b6;
    --sw-8:#c084fc; --sw-9:#94a3b8; --sw-10:#a78bfa; --sw-11:#22d3ee;
    --shadow:none; --sheet-shadow:0 -8px 40px rgb(0 0 0 / .5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg:#141419; --surface:#1d1d23; --surface-2:#26262e; --surface-3:#32323c;
  --border:#2e2e37; --card-border:#2e2e37;
  --text:#ebebf0; --text-2:#a5a5b1; --text-3:#71717d;
  --ink:#e8e8ef; --on-ink:#1a1a20;
  --cat-study:#6366f1; --cat-study-soft:#2c2c52; --cat-study-deep:#a5a7f9;
  --cat-work:#0d9488; --cat-work-soft:#123531; --cat-work-deep:#4fd4c5;
  --cat-personal:#d97706; --cat-personal-soft:#3f2d12; --cat-personal-deep:#f3a94e;
  --success:#3fbf74; --success-soft:#15321f;
  --danger:#ef6a6a; --danger-soft:#3d1d1d;
  --sw-0:#8b8df8; --sw-1:#38bdf8; --sw-2:#2dd4bf; --sw-3:#4ade80;
  --sw-4:#facc15; --sw-5:#fb923c; --sw-6:#f87171; --sw-7:#f472b6;
  --sw-8:#c084fc; --sw-9:#94a3b8; --sw-10:#a78bfa; --sw-11:#22d3ee;
  --shadow:none; --sheet-shadow:0 -8px 40px rgb(0 0 0 / .5);
}

/* ================= base ================= */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 400 14.5px/1.5 var(--font-ui);
  -webkit-font-smoothing: antialiased;
  overflow-x: clip;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 4px; }
::placeholder { color: var(--text-3); opacity: 1; }

/* ================= app layout ================= */
#app { min-height: 100dvh; display: flex; flex-direction: column; }
#main { flex: 1; width: 100%; max-width: 660px; margin-inline: auto; padding: 14px 16px calc(84px + env(safe-area-inset-bottom)); }
#sidebar { display: none; }

#topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 4px; min-height: 34px; }
.view-title { font: 700 21px/1.25 var(--font-display); letter-spacing: -0.01em; text-wrap: balance; }

/* bottom tab bar (mobile) */
#tabbar {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 40;
  display: flex; background: var(--surface);
  border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom);
}
#tabbar button {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 8px 0 6px; color: var(--text-2); font-size: 10.5px; font-weight: 500;
}
#tabbar button svg { width: 23px; height: 23px; }
#tabbar button[aria-current="true"] { color: var(--text); font-weight: 600; }

@media (min-width: 900px) {
  #app { flex-direction: row; }
  #tabbar { display: none; }
  #sidebar {
    display: flex; flex-direction: column; gap: 4px;
    width: 226px; flex-shrink: 0; position: sticky; top: 0; height: 100dvh;
    padding: 22px 14px; border-right: 1px solid var(--border); background: var(--surface);
  }
  #main { max-width: 1060px; padding: 26px 36px 60px; }
  .wordmark { font: 700 19px/1 var(--font-display); letter-spacing: -0.02em; padding: 2px 10px 18px; display: flex; align-items: baseline; gap: 8px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 9px 10px; border-radius: var(--r-sm);
    color: var(--text-2); font-weight: 500; font-size: 14px; text-align: left;
  }
  .nav-item svg { width: 19px; height: 19px; flex-shrink: 0; }
  .nav-item:hover { background: var(--surface-2); color: var(--text); }
  .nav-item[aria-current="true"] { background: var(--surface-3); color: var(--text); font-weight: 600; }
  .nav-section { font-size: 10.5px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--text-3); padding: 16px 10px 5px; }
  .nav-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-inline: 5px 0; }
}

/* ================= shared components ================= */
.card {
  background: var(--surface); border-radius: var(--r-md);
  border: 1px solid var(--card-border); box-shadow: var(--shadow);
  padding: 15px 16px;
}
@media (min-width: 900px) { .card { padding: 18px 20px; } }
.section-label {
  font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--text-3); margin: 22px 2px 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.stack { display: flex; flex-direction: column; gap: 10px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: 40px; padding: 0 16px; border-radius: var(--r-sm);
  font-weight: 600; font-size: 14px;
}
.btn-primary { background: var(--ink); color: var(--on-ink); }
.btn-primary:active { transform: scale(.97); }
.btn-ghost { background: var(--surface-2); color: var(--text); }
.btn-ghost:active { transform: scale(.97); }
.btn-quiet { color: var(--text-2); font-weight: 500; min-height: 36px; padding: 0 10px; border-radius: var(--r-sm); }
.btn-quiet:hover { background: var(--surface-2); }
.btn-danger { color: var(--danger); font-weight: 600; min-height: 40px; padding: 0 12px; border-radius: var(--r-sm); }
.btn-danger:hover { background: var(--danger-soft); }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: var(--r-sm); color: var(--text-2); }
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn svg { width: 19px; height: 19px; }

/* segmented control */
.seg { display: flex; background: var(--surface-2); border-radius: 999px; padding: 3px; position: relative; }
.seg button {
  flex: 1; position: relative; z-index: 1; min-height: 36px; border-radius: 999px;
  font-weight: 500; font-size: 13.5px; color: var(--text-2); border: 1px solid transparent;
}
.seg button[aria-current="true"] { color: var(--text); font-weight: 600; background: var(--surface); box-shadow: var(--shadow); border: 1px solid var(--card-border); }
@media (min-width: 900px) { .seg-planner { display: none; } }

/* week bar */
.weekbar {
  position: sticky; top: 0; z-index: 30; background: var(--bg);
  display: flex; align-items: center; gap: 4px;
  padding: 8px 0; margin: 2px 0 4px;
}
.weekbar-label { flex: 1; text-align: center; font: 600 15px/1.3 var(--font-display); border-radius: var(--r-sm); min-height: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.weekbar-label:hover { background: var(--surface-2); }
.weekbar-label .sub { font: 500 11.5px/1.2 var(--font-ui); color: var(--text-3); }
.weekbar-label.elsewhere { box-shadow: inset 0 -2px 0 var(--ink); }
.weekbar .today-btn { font-size: 12.5px; font-weight: 600; min-height: 34px; padding: 0 12px; border-radius: 999px; background: var(--surface-3); }

/* list rows */
.rows { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 11px; min-height: 50px; padding: 5px 2px; border-radius: var(--r-sm); }
.row + .row { border-top: 1px solid var(--border); }
.row-main { flex: 1; min-width: 0; text-align: left; padding: 4px 0; }
.row-title { font-weight: 500; font-size: 14.5px; line-height: 1.35; overflow-wrap: anywhere; }
.row-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); margin-top: 1px; overflow-wrap: anywhere; }
.row.done .row-title { color: var(--text-3); text-decoration: line-through; text-decoration-thickness: 1px; }
.row.done { opacity: .78; }
.cat-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.deadline-mark { font-size: 10px; }
.date-chip { font-size: 11.5px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: var(--surface-2); color: var(--text-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.date-chip.overdue { background: var(--danger-soft); color: var(--danger); }

/* checkbox */
.check {
  width: 24px; height: 24px; border-radius: 7px; flex-shrink: 0;
  border: 2px solid var(--text-3); background: transparent;
  display: inline-flex; align-items: center; justify-content: center;
  position: relative;
}
.check::after { content: ""; position: absolute; inset: -10px; }
.check svg { width: 14px; height: 14px; stroke: var(--on-ink); stroke-width: 3; fill: none; opacity: 0; }
.check[aria-pressed="true"] { border-color: transparent; }
.check[aria-pressed="true"] svg { opacity: 1; stroke-dasharray: 20; stroke-dashoffset: 0; }
@media (prefers-reduced-motion: no-preference) {
  .check[aria-pressed="true"] svg { animation: checkdraw 200ms ease-out; }
  @keyframes checkdraw { from { stroke-dashoffset: 20; } to { stroke-dashoffset: 0; } }
}

/* quick add */
.quick-add { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px dashed var(--border); border-radius: var(--r-md); padding: 3px 6px 3px 14px; }
.quick-add input { flex: 1; border: 0; background: none; min-height: 44px; font-size: 14.5px; min-width: 0; }
.quick-add input:focus { outline: none; }
.quick-add:focus-within { border-style: solid; border-color: var(--text-3); }

/* banners */
.banner { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: var(--r-md); font-size: 13px; font-weight: 500; margin: 10px 0; }
.banner-warn { background: var(--danger-soft); color: var(--danger); }
.banner-info { background: var(--surface-3); color: var(--text-2); }
.banner .spacer { flex: 1; }
.banner button { font-weight: 600; text-decoration: underline; text-underline-offset: 2px; color: inherit; min-height: 32px; }

/* save chip */
#save-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--text-3); min-height: 34px; padding: 0 10px; border-radius: 999px; }
#save-chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); }
#save-chip.st-saved .dot { background: var(--success); }
#save-chip.st-saving .dot { background: var(--cat-personal); }
#save-chip.st-error { color: var(--danger); } #save-chip.st-error .dot { background: var(--danger); }
@media (prefers-reduced-motion: no-preference) {
  #save-chip.st-saving .dot { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
}
@media (max-width: 899px) { #save-chip .chip-text { display: none; } #save-chip.st-error .chip-text, #save-chip.st-local .chip-text, #save-chip.st-readonly .chip-text { display: inline; } }

/* home */
.home-date { font-size: 13px; color: var(--text-2); font-weight: 500; }
.ring-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.ring-card { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 6px 12px; background: var(--surface); border: 1px solid var(--card-border); border-radius: var(--r-md); box-shadow: var(--shadow); }
.ring-card .lbl { font-size: 12px; font-weight: 600; color: var(--text-2); }
.habit-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.hchip { display: inline-flex; align-items: center; gap: 7px; min-height: 40px; padding: 0 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); font-weight: 500; font-size: 13.5px; max-width: 100%; overflow-wrap: anywhere; }
.hchip[aria-pressed="true"] { background: var(--success-soft); border-color: transparent; color: var(--text); }
.hchip .hdot { width: 9px; height: 9px; border-radius: 50%; }
.hchip[aria-pressed="true"] .hdot { background: var(--success) !important; }
.anytime-toggle { width: 100%; display: flex; align-items: center; gap: 8px; min-height: 42px; color: var(--text-2); font-size: 13px; font-weight: 500; padding: 0 2px; }
.anytime-toggle .chev { transition: transform 150ms; } .anytime-toggle.open .chev { transform: rotate(90deg); }
@media (min-width: 900px) {
  .home-grid { display: grid; grid-template-columns: 7fr 5fr; gap: 22px; align-items: start; }
}

/* course card */
.course-card { border-left: 3px solid var(--surface-3); }
.course-head { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; min-height: 34px; }
.course-name { font: 600 15.5px/1.3 var(--font-display); flex: 1; min-width: 0; overflow-wrap: anywhere; }
.course-count { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ghost-add { display: flex; align-items: center; gap: 9px; min-height: 42px; color: var(--text-3); font-size: 13.5px; width: 100%; text-align: left; border-radius: var(--r-sm); padding: 0 2px; }
.ghost-add:hover { color: var(--text-2); }
.summary-block { border-top: 1px solid var(--border); margin-top: 8px; padding-top: 10px; }
.summary-block .lbl { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); margin-bottom: 4px; }
.summary-preview { width: 100%; text-align: left; font-size: 13.5px; color: var(--text-2); line-height: 1.5; border-radius: var(--r-sm); padding: 4px 2px; overflow-wrap: anywhere; }
.summary-preview.empty { color: var(--text-3); font-style: italic; }
.summary-edit { width: 100%; border: 0; background: var(--surface-2); border-radius: var(--r-sm); padding: 10px 12px; font-size: 13.5px; line-height: 1.5; resize: none; display: block; }
.summary-edit:focus { outline: 2px solid var(--ink); outline-offset: 0; }

/* insights */
.insights-toggle { width: 100%; display: flex; align-items: center; gap: 8px; min-height: 44px; font-weight: 600; font-size: 13.5px; color: var(--text-2); }
.insights-toggle .chev { transition: transform 150ms; } .insights-toggle.open .chev { transform: rotate(90deg); }
.insights-body { display: flex; flex-wrap: wrap; gap: 20px; align-items: center; justify-content: center; padding: 6px 0 4px; }

/* charts */
.chart-wrap { width: 100%; }
.chart-wrap svg { width: 100%; height: auto; display: block; }
.chart-caption { font-size: 12px; color: var(--text-2); min-height: 18px; margin-top: 6px; font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-2); }
.legend i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
.svg-num { font: 700 10px var(--font-display); fill: var(--text); }
.svg-lbl { font: 500 8.5px var(--font-ui); fill: var(--text-2); }
.svg-lbl.now { font-weight: 600; fill: var(--text); }

/* calendar */
.cal-head { display: flex; align-items: center; gap: 4px; margin: 6px 0 10px; }
.cal-title { flex: 1; text-align: center; font: 600 16px/1.2 var(--font-display); }
.cal-grid { display: grid; grid-template-columns: 26px repeat(7, minmax(0, 1fr)); gap: 3px; }
.cal-dow { font-size: 10.5px; font-weight: 600; color: var(--text-2); text-align: center; padding: 4px 0; text-transform: uppercase; letter-spacing: .04em; }
.cal-wk { display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; color: var(--text-3); border-radius: 6px; font-variant-numeric: tabular-nums; }
.cal-wk:hover { background: var(--surface-2); color: var(--text); }
.cal-cell {
  background: var(--surface); border: 1px solid var(--card-border); box-shadow: var(--shadow);
  border-radius: 8px; padding: 4px 3px; min-height: 52px;
  display: flex; flex-direction: column; align-items: stretch; gap: 3px; overflow: hidden;
}
.cal-cell.out { background: none; box-shadow: none; border-color: transparent; }
.cal-cell.out .cal-num { color: var(--text-3); opacity: .55; }
.cal-cell.selected { outline: 2px solid var(--ink); outline-offset: -1px; }
.cal-num { font-size: 11.5px; font-weight: 600; align-self: center; width: 21px; height: 21px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-variant-numeric: tabular-nums; }
.cal-cell.today .cal-num { background: var(--ink); color: var(--on-ink); }
.cal-dots { display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; padding-bottom: 2px; }
.cal-dot { width: 6px; height: 6px; border-radius: 50%; }
.cal-dot.diamond { border-radius: 1.5px; transform: rotate(45deg); }
.cal-dot.done { opacity: .35; }
.cal-dot.ev { background: transparent; border: 1.5px solid var(--text-3); }
.cal-more { font-size: 9px; color: var(--text-3); line-height: 6px; }
.cal-pills { display: none; }
@media (min-width: 900px) {
  .cal-grid { gap: 5px; grid-template-columns: 34px repeat(7, minmax(0, 1fr)); }
  .cal-cell { min-height: 96px; padding: 6px; }
  .cal-num { align-self: flex-end; }
  .cal-dots { display: none; }
  .cal-pills { display: flex; flex-direction: column; gap: 3px; }
  .cal-pill { font-size: 11px; font-weight: 500; line-height: 1.35; padding: 2px 7px; border-radius: 5px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
  .cal-pill.done { opacity: .5; text-decoration: line-through; }
  .cal-pill-ev { background: transparent; border: 1px solid var(--border); color: var(--text-2); font-variant-numeric: tabular-nums; }
  .cal-pill-more { font-size: 10.5px; color: var(--text-3); padding: 0 7px; text-align: left; }
}
.cal-empty-note { text-align: center; font-size: 12.5px; color: var(--text-3); margin-top: 14px; }

/* habits */
.habit-card .hd { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; }
.habit-name { font: 600 15.5px/1.3 var(--font-display); flex: 1; min-width: 0; overflow-wrap: anywhere; }
.habit-stats { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.streak { display: inline-flex; align-items: center; gap: 3px; font-weight: 600; color: var(--cat-personal-deep); }
.habit-days { display: flex; justify-content: space-between; margin-top: 10px; }
.hday { display: flex; flex-direction: column; align-items: center; gap: 5px; width: 40px; }
.hday .dlbl { font-size: 10px; font-weight: 600; color: var(--text-3); text-transform: uppercase; }
.hday.today .dlbl { color: var(--text); }
.hcell {
  width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--border);
  display: inline-flex; align-items: center; justify-content: center; position: relative;
}
.hcell::after { content: ""; position: absolute; inset: -6px; }
.hcell svg { width: 16px; height: 16px; stroke: var(--on-ink); stroke-width: 3; fill: none; opacity: 0; }
.hcell[aria-pressed="true"] { background: var(--success); border-color: var(--success); }
.hcell[aria-pressed="true"] svg { opacity: 1; }

function mdLite(text) {

  h = h.replace(/\*\*([^\n]+?)\*\*/g, "<b>$1</b>");

}

/* ---- charts (inline SVG, theme tokens) ---- */
function ringSVG(done, total, color, size) {
  const pct = total > 0 ? Math.round(100 * done / total) : 0;
  const center = total > 0 ? `${done}/${total}` : "–";
  return `<svg width="${size}" height="${size}" viewBox="0 0 36 36" role="img" aria-label="${done} of ${total} done">
    <circle cx="18" cy="18" r="15.9" fill="none" stroke="var(--surface-3)" stroke-width="3.6"/>
    <circle cx="18" cy="18" r="15.9" fill="none" stroke="${color}" stroke-width="3.6" stroke-linecap="round"
      stroke-dasharray="${pct} 100" transform="rotate(-90 18 18)"/>
    <text x="18" y="19.5" text-anchor="middle" class="svg-num" style="font-size:${total > 9 ? 8 : 9}px">${center}</text>
  </svg>`;
}
function niceMax(v) {
  if (v <= 4) return Math.max(2, v);
  for (const s of [5, 10, 15, 20, 30, 50, 100, 200, 500, 1000]) if (v <= s) return s;
  return Math.ceil(v / 1000) * 1000;
}
/* rows: [{weekKey, segs: [{val, fill, name}]}] bottom-up stacking */
function stackedBarsSVG(rows, opts = {}) {
  const W = 320, H = 142, top = 16, bottom = 20, left = 6, right = 6;
  const plotH = H - top - bottom;
  const n = rows.length;
  const pitch = (W - left - right) / n, barW = Math.min(24, pitch - 12);
  const totals = rows.map(r => r.segs.reduce((s, x) => s + x.val, 0));
  const maxV = Math.max(...totals, 0);
  const empty = maxV === 0;
  const yMax = niceMax(maxV);
  const scale = plotH / yMax;
  let bars = "";
  const cw = currentWeekKey();
  rows.forEach((r, i) => {
    const cx = left + pitch * i + pitch / 2;
    const x = cx - barW / 2;
    let y = H - bottom;
    let segRects = "";
    const drawn = r.segs.filter(s => s.val > 0);
    drawn.forEach((s, si) => {
      let h = Math.max(s.val * scale - 2, 2);
      y -= h;
      const isTop = si === drawn.length - 1;
      const strokeAttr = s.stroke ? ` stroke="${s.stroke}" stroke-width="1"` : "";
      if (isTop && h >= 4) {
        const rr = 3;
        segRects += `<path d="M${x} ${y + h} V${y + rr} Q${x} ${y} ${x + rr} ${y} H${x + barW - rr} Q${x + barW} ${y} ${x + barW} ${y + rr} V${y + h} Z" fill="${s.fill}"${strokeAttr}/>`;
      } else {
        segRects += `<rect x="${x}" y="${y}" width="${barW}" height="${h}" fill="${s.fill}"${strokeAttr}/>`;
      }
      y -= 2;
    });
    if (empty) {
      const gh = [42, 68, 50, 78, 36, 58, 72, 46][i % 8];
      segRects = `<rect x="${x}" y="${H - bottom - gh}" width="${barW}" height="${gh}" rx="3" fill="var(--surface-3)" opacity=".5"/>`;
    }
    const wk = parseWeekKey(r.weekKey).week;
    const tip = r.segs.map(s => `${s.val} ${s.name}`).join(", ");
    bars += `<g data-week="${esc(r.weekKey)}" data-tip="Week ${wk} — ${esc(tip)}" style="cursor:${empty ? "default" : "pointer"}">
      <title>Week ${wk} — ${esc(tip)}</title>
      <rect x="${left + pitch * i}" y="0" width="${pitch}" height="${H}" fill="transparent"/>
      ${segRects}
      <text x="${cx}" y="${H - 6}" text-anchor="middle" class="svg-lbl${r.weekKey === cw ? " now" : ""}">W${wk}</text>
    </g>`;
  });
  const grid = empty ? "" : `<line x1="${left}" y1="${H - bottom - yMax * scale}" x2="${W - right}" y2="${H - bottom - yMax * scale}" stroke="var(--border)" stroke-dasharray="3 3"/>
    <text x="${left + 1}" y="${H - bottom - yMax * scale - 4}" class="svg-lbl">${yMax}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.ariaLabel || "Tasks per week")}">
    <line x1="${left}" y1="${H - bottom}" x2="${W - right}" y2="${H - bottom}" stroke="var(--border)"/>
    ${grid}${bars}
  </svg>`;
}
function legendHTML(items) {
  return `<div class="legend">${items.map(i => `<span><i style="background:${i.fill}${i.stroke ? `;border:1px solid ${i.stroke}` : ""}"></i>${esc(i.name)}</span>`).join("")}</div>`;
}
function sparklineSVG(points) {
  const W = 84, H = 26, pad = 2;
  if (!points.length) return "";
  const step = (W - pad * 2) / Math.max(1, points.length - 1);
  const xy = points.map((p, i) => [pad + i * step, H - pad - p.pct * (H - pad * 2)]);
  const line = xy.map(p => p.map(v => v.toFixed(1)).join(",")).join(" ");
  const area = `${pad},${H - pad} ${line} ${(pad + (points.length - 1) * step).toFixed(1)},${H - pad}`;
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="completion trend">
    <polygon points="${area}" fill="var(--success-soft)"/>
    <polyline points="${line}" fill="none" stroke="var(--success)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${xy[xy.length - 1][0]}" cy="${xy[xy.length - 1][1]}" r="2" fill="var(--success)"/>
  </svg>`;
}

function focusSelectorFor(el) {
  if (!el || el === document.body || !el.dataset || !el.dataset.action) return null;
  let sel = `[data-action="${CSS.escape(el.dataset.action)}"]`;
  for (const [k, v] of Object.entries(el.dataset)) {
    if (k === "action") continue;
    sel += `[data-${k.replace(/[A-Z]/g, m => "-" + m.toLowerCase())}="${CSS.escape(v)}"]`;
  }
  return sel;
}
function openSheet(kind, params = {}) {
  UI.sheetOpener = focusSelectorFor(document.activeElement);
  UI.sheetJustOpened = true;
  UI.sheet = { kind, params };
  renderSheet();
}
function closeSheet() {
  if (!UI.sheet) return;
  UI.sheet = null; renderSheet(); render();
  if (UI.sheetOpener) {
    const el = document.querySelector(UI.sheetOpener);
    if (el) el.focus({ preventScroll: true });
    UI.sheetOpener = null;
  }
}
function renderSheet() {
  const root = document.getElementById("sheet-root");
  if (!UI.sheet) { root.classList.remove("open"); root.innerHTML = ""; return; }
  const hadFocus = root.contains(document.activeElement);
  const focusSel = hadFocus ? focusSelectorFor(document.activeElement) : null;
  const body = SHEETS[UI.sheet.kind] ? SHEETS[UI.sheet.kind](UI.sheet.params) : "";
  root.classList.add("open");
  root.innerHTML = `<div class="backdrop" data-action="sheet-close"></div>
    <div class="sheet" role="dialog" aria-modal="true" tabindex="-1"><div class="sheet-grip"></div>${body}</div>`;
  const sheetEl = root.querySelector(".sheet");
  const h2 = sheetEl.querySelector("h2");
  if (h2) { h2.id = "sheet-title"; sheetEl.setAttribute("aria-labelledby", "sheet-title"); }
  if (UI.sheetJustOpened) {
    UI.sheetJustOpened = false;
    const focusEl = root.querySelector("[data-autofocus]");
    if (focusEl && window.matchMedia("(min-width: 900px)").matches) focusEl.focus();
    else sheetEl.focus({ preventScroll: true });
  } else if (focusSel && root.querySelector(focusSel)) {
    root.querySelector(focusSel).focus({ preventScroll: true });
  } else if (hadFocus) {
    sheetEl.focus({ preventScroll: true });
  }
  hydrateThumbs(root);
}
let toastTimer = null, toastAction = null;

function viewPlanner() {
  const cat = UI.plannerTab, wk = UI.weekKey, cw = currentWeekKey();
  const all = tasksForWeek(wk, cat);
  const deadlines = all.filter(t => t.isDeadline).sort((a, b) => String(a.dueDate || "9").localeCompare(String(b.dueDate || "9")));
  const normal = all.filter(t => !t.isDeadline);
  const catOverdue = wk === cw ? overdueTasks().filter(t => t.category === cat) : [];
  let body = "";
  if (cat === "study" || cat === "work") {
    const groups = activeGroups(cat);
    const catGroups = [...S.courses].sort(byOrder).filter(c => c.category === cat);
    const showAll = compareWeekKeys(wk, cw) >= 0;
    const cards = [];
    const cardIds = new Set();
    for (const c of catGroups) {
      const tasks = normal.filter(t => t.courseId === c.id);
      const entry = S.weeklySummaries[wk]?.courses?.[c.id] || null;
      const visible = c.archived ? (tasks.length || entry) : (showAll || tasks.length || entry);
      if (!visible) continue;
      cardIds.add(c.id);
      cards.push(courseCardHTML(c, tasks, entry, wk, cat));
    }
    // no group, a group of another category, or a dangling reference → General (kept on top)
    const generalTasks = normal.filter(t => !t.courseId || !cardIds.has(t.courseId));
    if (generalTasks.length || (cat === "work" && !cards.length)) cards.unshift(courseCardHTML(null, generalTasks, null, wk, cat));
    if (cat === "study" && !groups.length && !cards.length) {
      body = `<div class="card empty" style="margin-top:14px">
        <div class="big">No courses yet</div>
        Courses give your tasks a color and a home.
        <br><button class="btn btn-primary" data-action="manage-courses" data-cat="study">Add your first course</button></div>`;
    } else {
      body = `<div class="stack" style="margin-top:12px">${cards.join("")}</div>
        ${!normal.length && !deadlines.length ? peekNextHTML(cat) : ""}`;
    }
    if (cat === "work") body += summaryBlockHTML("work", wk, S.weeklySummaries[wk]?.work || null, "Week notes");
    body += `<div style="text-align:center;margin-top:12px"><button class="btn-quiet" data-action="manage-courses" data-cat="${cat}">${IC.gear}&nbsp; Manage ${GROUP_NOUN_PLURAL[cat].toLowerCase()}</button></div>`;
  } else {
    body = `<div class="card" style="margin-top:12px">
      <div class="section-label" style="margin:0 0 6px">This week</div>
      ${normal.length ? `<div class="rows">${sortedRows(normal)}</div>` : `<div class="empty" style="padding:12px">No tasks yet for this week.</div>`}
      <button class="ghost-add" data-action="open-task-sheet" data-cat="personal" data-week="${wk}">${IC.plus}<span>Add task</span></button>
    </div>
    ${!normal.length && !deadlines.length ? peekNextHTML(cat) : ""}`;
  }
  return `<div class="seg seg-planner" style="margin-bottom:6px">${CATS.map(c =>
      `<button data-action="planner-tab" data-tab="${c}" aria-current="${UI.plannerTab === c}">${CAT_LABEL[c]}</button>`).join("")}</div>
    ${weekbarHTML()}
    ${overdueBannerHTML(catOverdue, cat)}
    ${quickAddHTML(cat, wk)}
    ${deadlines.length ? `<div class="section-label">Deadlines this week</div>
      <div class="card"><div class="rows">${deadlines.map(t => taskRowHTML(t, { longDate: true })).join("")}</div></div>` : ""}
    ${body}
    ${insightsHTML(cat)}`;
}
function courseCardHTML(course, tasks, entry, wk, cat) {
  const color = course ? swColor(course.colorIndex) : "var(--surface-3)";
  const name = course ? course.name : "General";
  const done = tasks.filter(t => t.status === "done").length;
  return `<div class="card course-card" style="border-left-color:${color}">
    <div class="course-head">
      <span class="course-name">${esc(name)}${course && course.archived ? ' <small style="color:var(--text-3);font:500 11px var(--font-ui)">archived</small>' : ""}</span>
      ${tasks.length ? `<span class="course-count">${done}/${tasks.length} done</span>` : ""}
    </div>
    ${tasks.length ? `<div class="rows" style="margin-top:4px">${sortedRows(tasks, { hideContext: true })}</div>` : ""}
    <button class="ghost-add" data-action="open-task-sheet" data-cat="${esc(cat)}" data-week="${wk}" ${course ? `data-course="${esc(course.id)}"` : ""}>${IC.plus}<span>Add task</span></button>
    ${course ? summaryBlockHTML(course.id, wk, entry, "Week summary") : ""}
  </div>`;
}
function summaryBlockHTML(scope, wk, entry, label) {
  const text = entry ? String(entry.text || "") : "";
  const images = entry && entry.images ? entry.images : [];
  const editing = UI.editingSummary === scope + "|" + wk;
  const owner = `data-scope="${esc(scope)}" data-week="${wk}"`;
  let inner;
  if (editing) {
    inner = `<div class="md-tools">
        <button type="button" data-action="md-wrap" data-wrap="**" aria-label="Bold"><b>B</b></button>
        <button type="button" data-action="md-wrap" data-wrap="*" aria-label="Italic"><i>I</i></button>
        <button type="button" data-action="att-add-summary" ${owner} aria-label="Add image">${IC.image}</button>
      </div>
      <textarea class="summary-edit" rows="3" data-summary="${esc(scope)}" data-week="${wk}" data-draft-id="sum:${esc(scope)}|${wk}" placeholder="How did this week go?">\n${esc(text)}</textarea>
      <div class="hint">**bold** · *italic* · paste a screenshot to attach it</div>
      ${attRowHTML(images, owner)}`;
  } else {
    inner = `<button class="summary-preview${text || images.length ? "" : " empty"}" data-action="summary-edit" ${owner}>${text ? mdLite(text) : (images.length ? "<span style='color:var(--text-3)'>Add text…</span>" : "Add a summary for this week…")}</button>
      ${attRowHTML(images, owner)}`;
  }
  const bodyHtml = `<div class="lbl">${label}${scope === "work" ? " · week " + parseWeekKey(wk).week : ""}</div>${inner}`;
  return scope === "work"
    ? `<div class="card" style="margin-top:12px"><div class="summary-block" style="border-top:0;margin-top:0;padding-top:0">${bodyHtml}</div></div>`
    : `<div class="summary-block">${bodyHtml}</div>`;
}

function viewCalendar() {
  const y = UI.calYear, m = UI.calMonth0;
  const weeks = calendarMonth(y, m);
  const anyItems = weeks.some(w => w.days.some(d => d.items.length || eventsOn(d.dateKey).length));
  const dows = ["M", "T", "W", "T", "F", "S", "S"];
  const dows3 = DAY3;
  let grid = `<div class="cal-dow"></div>` + dows.map((d, i) =>
    `<div class="cal-dow"><span class="l1">${d}</span><span class="l3">${dows3[i]}</span></div>`).join("");
  for (const w of weeks) {
    grid += `<button class="cal-wk" data-action="cal-week-jump" data-week="${w.weekKey}" aria-label="Open week ${parseWeekKey(w.weekKey).week} in planner">W${parseWeekKey(w.weekKey).week}</button>`;
    for (const d of w.days) {
      const evs = eventsOn(d.dateKey);
      const dots = d.items.slice(0, 4).map(t =>
        `<span class="cal-dot${t.isDeadline ? " diamond" : ""}${t.status === "done" ? " done" : ""}" style="background:${taskColor(t)}"></span>`).join("") +
        (d.items.length > 4 ? `<span class="cal-more">+</span>` : "") +
        (evs.length ? `<span class="cal-dot ev"></span>` : "");
      const taskPills = d.items.slice(0, 3).map(t =>
        `<span class="cal-pill${t.status === "done" ? " done" : ""}" style="background:${catSoft(t.category)}">${t.isDeadline ? "◆ " : ""}${esc(t.title)}</span>`).join("") +
        (d.items.length > 3 ? `<span class="cal-pill-more">+${d.items.length - 3} more</span>` : "");
      const evSlots = Math.max(0, 4 - Math.min(d.items.length, 3) - (d.items.length > 3 ? 1 : 0));
      const evPills = evs.slice(0, evSlots).map(e =>
        `<span class="cal-pill cal-pill-ev">${e.allDay ? "" : esc(evTime(e).split("–")[0]) + " "}${esc(e.title)}</span>`).join("") +
        (evs.length > evSlots ? `<span class="cal-pill-more">+${evs.length - evSlots} event${evs.length - evSlots === 1 ? "" : "s"}</span>` : "");
      const total = d.items.length + evs.length;
      grid += `<button class="cal-cell${d.inMonth ? "" : " out"}${d.isToday ? " today" : ""}" data-action="cal-day" data-date="${d.dateKey}" aria-label="${fmtDateShort(d.dateKey)}, ${total} item${total === 1 ? "" : "s"}">
        <span class="cal-num">${d.day}</span>
        ${total ? `<span class="cal-dots">${dots}</span><span class="cal-pills">${d.items.length ? taskPills : ""}${evPills}</span>` : ""}
      </button>`;
    }
  }
  const isThisMonth = y === new Date().getFullYear() && m === new Date().getMonth();
  return `<div class="cal-head">
      <button class="icon-btn" data-action="cal-nav" data-dir="-1" aria-label="Previous month">${IC.left}</button>
      <span class="cal-title">${MONTHS[m]} ${y}</span>
      ${isThisMonth ? "" : `<button class="today-btn" data-action="cal-today">Today</button>`}
      <button class="icon-btn" data-action="cal-nav" data-dir="1" aria-label="Next month">${IC.right}</button>
    </div>
    <div class="cal-grid">${grid}</div>
    ${anyItems ? "" : `<div class="cal-empty-note">Tasks with a date will show up here.</div>`}`;
}

function viewHabits() {
  const wk = UI.weekKey;
  const today = todayKey();
  const daily = S.habits.filter(h => !h.archived && h.kind === "daily").sort(byOrder);
  const weekly = S.habits.filter(h => !h.archived && h.kind === "weekly").sort(byOrder);
  const archived = S.habits.filter(h => h.archived).sort(byOrder);
  const ds = weekDates(wk);
  let out = weekbarHTML();
  if (!daily.length && !weekly.length) {
    out += `<div class="card empty" style="margin-top:14px">
      <div class="big">No habits yet</div>
      Habits you check off daily, or weekly goals like “Gym 3×”.
      <br><button class="btn btn-primary" data-action="new-habit">New habit</button></div>`;
  }
  if (daily.length) {
    out += `<div class="section-label">Daily habits</div><div class="stack">` + daily.map(h => {
      const st = habitStreaks(h);
      const pct = habit28dPct(h);
      const expanded = UI.expandedHabit === h.id;
      const cells = ds.map(d => {
        const dk = dateKeyOf(d);
        const active = habitActiveOn(h, d) && dk >= h.startDate;
        const future = dk > today;
        const on = habitChecked(h, dk);
        return `<span class="hday${dk === today ? " today" : ""}">
          <span class="dlbl">${DAY3[isoDow(d)][0]}</span>
          <button class="hcell${dk === today ? " today" : ""}" data-action="hcell" data-id="${esc(h.id)}" data-date="${dk}"
            aria-pressed="${on}" aria-label="${esc(h.name)} on ${fmtDateShort(dk)}" ${(!active || future) ? "disabled" : ""}>${IC.check}</button>
        </span>`;
      }).join("");
      return `<div class="card habit-card">
        <button class="hd" data-action="habit-expand" data-id="${esc(h.id)}" aria-expanded="${expanded}">
          <span class="cat-dot" style="background:${swColor(h.colorIndex)}"></span>
          <span class="habit-name">${esc(h.name)}</span>
          <span class="habit-stats">${st.current > 0 ? `<span class="streak">${IC.flame}${st.current}</span>` : ""}${pct != null ? `<span>${pct}%</span>` : ""}</span>
        </button>
        <div class="habit-days">${cells}</div>
        ${expanded ? habitDetailHTML(h) : ""}
      </div>`;
    }).join("") + `</div>`;
  }
  if (weekly.length) {
    out += `<div class="section-label">Weekly goals</div><div class="stack">` + weekly.map(h => {
      const p = habitWeekProgress(h, wk);
      const futureWeek = compareWeekKeys(wk, currentWeekKey()) > 0;
      const segs = Array.from({ length: Math.max(p.target, p.logged) }, (_, i) =>
        `<i class="${i < p.logged ? (i < p.target ? "on" : "extra") : ""}"></i>`).join("");
      const doneAll = p.logged >= p.target;
      return `<div class="card">
        <div class="hd" style="display:flex;align-items:center;gap:10px">
          <span class="cat-dot" style="background:${swColor(h.colorIndex)}"></span>
          <button class="habit-name" style="text-align:left;flex:1" data-action="edit-habit" data-id="${esc(h.id)}">${esc(h.name)}</button>
          <span class="habit-stats">${doneAll ? "Done — " : ""}${Number(p.logged) || 0} of ${Number(p.target) || 0}</span>
        </div>
        <div class="goal-row">
          <div class="goal-segs">${segs}</div>
          ${p.logged > 0 && !futureWeek ? `<button class="plus-btn" style="width:36px;height:36px;font-size:16px" data-action="goal-minus" data-id="${esc(h.id)}" data-week="${wk}" aria-label="Remove one">−</button>` : ""}
          <button class="plus-btn" data-action="goal-plus" data-id="${esc(h.id)}" data-week="${wk}" aria-label="Log one" ${futureWeek ? "disabled" : ""}>+</button>
        </div>
      </div>`;
    }).join("") + `</div>`;
  }
  if (daily.length || weekly.length) {
    out += `<div style="text-align:center;margin-top:16px"><button class="btn btn-ghost" data-action="new-habit">${IC.plus}&nbsp;New habit</button></div>`;
  }
  if (archived.length) {
    out += `<div class="section-label"><button class="btn-quiet" style="text-transform:inherit;letter-spacing:inherit;font-size:inherit;color:inherit" data-action="toggle-archived-habits">Archived (${archived.length}) ${UI.archivedHabitsOpen ? "▾" : "▸"}</button></div>`;
    if (UI.archivedHabitsOpen) {
      out += `<div class="card"><div class="rows">` + archived.map(h =>
        `<div class="row"><span class="cat-dot" style="background:${swColor(h.colorIndex)}"></span>
          <span class="row-main"><span class="row-title" style="color:var(--text-2)">${esc(h.name)}</span></span>
          <button class="btn-quiet" data-action="habit-restore" data-id="${esc(h.id)}">Restore</button>
          <button class="btn-quiet" style="color:var(--danger)" data-action="habit-delete" data-id="${esc(h.id)}">${UI.confirm2 === h.id ? "Really delete?" : "Delete"}</button>
        </div>`).join("") + `</div></div>`;
    }
  }
  return out;
}
function habitDetailHTML(h) {
  const today = todayKey();
  let rows = "";
  for (let wOff = 3; wOff >= 0; wOff--) {
    const k = addWeeks(currentWeekKey(), -wOff);
    rows += weekDates(k).map(d => {
      const dk = dateKeyOf(d);
      const na = !habitActiveOn(h, d) || dk < h.startDate || dk > today;
      return `<i class="${habitChecked(h, dk) ? "on" : na ? "na" : ""}" title="${dk}"></i>`;
    }).join("");
  }
  return `<div class="habit-detail">
    <div><div style="font-size:11px;color:var(--text-3);margin-bottom:5px">Last 4 weeks</div><div class="dotmatrix">${rows}</div></div>
    <div style="text-align:center"><div style="font-size:11px;color:var(--text-3);margin-bottom:5px">8-week trend</div>${sparklineSVG(habitCompletionSeries(h, 8))}</div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-ghost" data-action="edit-habit" data-id="${esc(h.id)}">Edit</button>
      <button class="btn-quiet" data-action="habit-archive" data-id="${esc(h.id)}">Archive</button>
    </div>
  </div>`;
}

}

  if (!summaryPending) return;

  if (mode === "readonly" || mode === "load-error" || futureVersion) return;
  dispatch({ t: "summary.set", weekKey: p.week, scope: p.scope, text: p.text }, { silent: true });
}
function currentCW() { return currentWeekKey(); }

const ACTIONS = {

    const courseId = (d.category === "study" || d.category === "work") ? d.courseId : null;
    const images = (d.images || []).length ? d.images : null;
    if (p.id) {
      const orig = findById(S.tasks, p.id);

      const weekKey = d.dueDate ? weekKeyOf(parseDateKey(d.dueDate)) : d.weekKey;
      dispatch({ t: "task.patch", id: p.id, patch: {

    } else {

    const m = /^ti_.+_(\d{4}-W\d{2})$/.exec(t.id);

        activeDays: d.kind === "daily" ? d.activeDays : [1, 2, 3, 4, 5, 6, 7],
      }}, { silent: true });
    } else {
      dispatch({ t: "habit.upsert", habit: {
        id: newId("h"), kind: d.kind, name: d.name.trim(), colorIndex: d.colorIndex,
        activeDays: d.kind === "daily" ? d.activeDays : [1, 2, 3, 4, 5, 6, 7],
        weeklyTarget: d.kind === "weekly" ? d.weeklyTarget : null,
        startDate: todayKey(), archived: false, sortOrder: nextSortOrder(S.habits),
        createdAt: nowIso(), updatedAt: nowIso(),
      }}, { silent: true });
    }
    closeSheet();
  },
  "habit-archive"(el) {
    dispatch({ t: "habit.patch", id: el.dataset.id, patch: { archived: true } }, { silent: true });
    UI.expandedHabit = null;
    if (el.dataset.close) closeSheet(); else render();
  },
  "habit-restore"(el) { dispatch({ t: "habit.patch", id: el.dataset.id, patch: { archived: false } }); },
  "habit-delete"(el) {
    const id = el.dataset.id;
    if (UI.confirm2 !== id) { UI.confirm2 = id; render(); return; }
    UI.confirm2 = null;
    dispatch({ t: "habit.deleteAll", id });
  },
  "toggle-archived-habits"() { UI.archivedHabitsOpen = !UI.archivedHabitsOpen; render(); },
  "open-sync"() {
    feedsSha = null; // never reuse a sha from an earlier sheet session
    openSheet("sync", { draft: { token: "", importJson: "", feedName: "", feedUrl: "" }, feeds: null });
    refreshFeedsUI();
  },
  async "cal-feed-add"() {
    const p = UI.sheet.params, d = p.draft;
    if (feedsBusy) return;
    syncDraftInputs();
    if (!Array.isArray(p.feeds)) { toast("Calendars are still loading — try again in a moment."); return; }
    const name = (d.feedName || "").trim() || "Calendar";
    const url = (d.feedUrl || "").trim();
    if (!/^https:\/\/.+/.test(url)) { toast("Paste the full https:// iCal link first."); document.querySelector('#sheet-root [data-draft-field="feedUrl"]')?.focus(); return; }
    const feeds = [...p.feeds, { name, url }];
    feedsBusy = true;
    try {
      await saveFeeds(feeds);
      p.feeds = feeds; d.feedName = ""; d.feedUrl = "";
      renderSheet(); renderFeedRows(feeds);
      toast("Calendar added — events appear within a few minutes.");
    } catch (e) {
      if (e.status === 409 || e.status === 422) { toast("The calendar list changed on another device — refreshed it, try again."); refreshFeedsUI(); }
      else toast("Couldn’t save the calendar — check your connection.");
    } finally { feedsBusy = false; }
  },
  async "cal-feed-remove"(el) {
    const p = UI.sheet.params;
    if (feedsBusy) return;
    if (!Array.isArray(p.feeds)) { toast("Calendars are still loading — try again in a moment."); return; }
    const feeds = [...p.feeds];
    let idx = +el.dataset.i;
    if (!feeds[idx] || feeds[idx].url !== el.dataset.url) idx = feeds.findIndex(f => f.url === el.dataset.url);
    if (idx < 0) { refreshFeedsUI(); return; }
    feeds.splice(idx, 1);
    feedsBusy = true;
    try {
      await saveFeeds(feeds);
      p.feeds = feeds;
      renderFeedRows(feeds);
      toast("Calendar removed.");
    } catch (e) {
      if (e.status === 409 || e.status === 422) { toast("The calendar list changed on another device — refreshed it, try again."); refreshFeedsUI(); }
      else toast("Couldn’t save — check your connection.");
    } finally { feedsBusy = false; }
  },
  "open-export"() { openSheet("export"); },
  async "sync-connect"() {
    syncDraftInputs();
    const p = UI.sheet.params;
    const tok = (p.draft.token || "").trim() || ghToken();
    if (!tok) { document.querySelector('#sheet-root [data-draft-field="token"]')?.focus(); return; }
    toast("Checking sync code…");
    let res;
    try { res = await ghLoad(tok); } catch { res = { error: 0 }; }
    if (res.authFail) { toast("That code doesn’t work — check its repository access and Contents permission."); return; }
    if (res.error !== undefined) { toast("Couldn’t reach GitHub — check your connection."); return; }
    setGhToken(tok);
    ghAuthFailed = false;
    if (res.text !== undefined) {
      ghSha = res.sha;
      const remote = tryHydrate(res.text);
      if (remote && remote.seq >= S.meta.seq) {
        S = remote.data; futureVersion = remote.future; normalize(S); rev++;
        try { localWrite(res.text); } catch {}
      } else if (remote) { dirty = true; }
    } else { ghSha = null; if (S.meta.seq > 0) dirty = true; }
    mode = futureVersion ? "readonly" : "github";
    if (dirty) { firstDirtyAt = firstDirtyAt || Date.now(); saveState = "dirty"; scheduleSave(500); }
    closeSheet();
    toast("Sync connected ✓");
  },
  "sync-disconnect"() {
    setGhToken(null); ghSha = null; ghAuthFailed = false;
    EV = null; evSha = null; evByDateCache = null; evByDateFor = null; feedsSha = null;
    if (mode === "github") mode = "local-only";
    closeSheet();
    toast("Sync disconnected — this device is local-only now");
  },
  "sync-import"() {
    if (mode === "readonly" || mode === "load-error" || futureVersion) { toast("Editing is paused right now."); return; }
    syncDraftInputs();
    const p = UI.sheet.params;
    const cand = tryHydrate((p.draft.importJson || "").trim());
    if (!cand || cand.future) { toast(cand ? "That backup is from a newer app version." : "That doesn’t look like a WeekWise backup."); return; }
    if (!p.confirmImport) { p.confirmImport = true; renderSheet(); refreshFeedsUI(); return; }
    S = cand.data; futureVersion = false; normalize(S); rev++;
    opLog = []; dirty = true; firstDirtyAt = Date.now(); saveState = "dirty"; scheduleSave(300);
    closeSheet();
    toast("Backup imported");
  },
  "sheet-close"() { closeSheet(); },
  "toast-action"() { if (toastAction) toastAction(); document.getElementById("toast-root").innerHTML = ""; toastAction = null; },
  "export-select"() { const t = document.getElementById("export-json"); if (t) { t.focus(); t.select(); } },
};

/* delegation */
document.addEventListener("click", (e) => {
  const g = e.target.closest("g[data-tip]");
  if (g) {
    const cap = g.closest(".chart-wrap")?.querySelector(".chart-caption");
    if (cap) cap.textContent = g.dataset.tip;
  }
  const el = e.target.closest("[data-action]");
  if (!el) return;
  // any click that isn't a delete disarms a pending two-step delete confirmation
  if (!/-delete$/.test(el.dataset.action)) UI.confirm2 = null;
  const fn = ACTIONS[el.dataset.action];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener("submit", (e) => {
  const form = e.target.closest("[data-form]");
  if (!form) return;
  e.preventDefault();
  if (form.dataset.form === "quick-add") {
    const input = form.querySelector("input[type=text]");
    const title = input.value.trim();
    if (!title) return;
    const cat = form.dataset.cat, wk = form.dataset.week;
    dispatch({ t: "task.upsert", task: {
      id: newId("t"), title, category: cat, courseId: null, label: null,
      weekKey: wk, dueDate: null, isDeadline: false, status: "open", doneAt: null,
      notes: "", templateId: null, sortOrder: nextSortOrder(S.tasks),
      createdAt: nowIso(), updatedAt: nowIso(),
    }});
    const again = document.querySelector(`#view [data-draft-id="qa:${cat}"]`);
    if (again) again.focus();
  } else if (form.dataset.form === "course-add") {
    const input = form.querySelector("#new-course-name");
    const name = input.value.trim();
    if (!name) return;
    const cat = form.dataset.cat === "work" ? "work" : "study";
    dispatch({ t: "course.upsert", course: {
      id: newId("c"), name, category: cat, colorIndex: S.courses.filter(c => c.category === cat).length % 12, archived: false,
      sortOrder: nextSortOrder(S.courses), createdAt: nowIso(), updatedAt: nowIso(),
    }}, { silent: true });
    renderSheet();
    const nn = document.getElementById("new-course-name"); if (nn) nn.focus();
  }
});
document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.matches("[data-draft-field]") && UI.sheet?.params?.draft) {
    UI.sheet.params.draft[el.dataset.draftField] = el.value;
  } else if (el.matches("[data-summary]")) {
    summaryPending = { scope: el.dataset.summary, week: el.dataset.week, text: el.value };
    clearTimeout(summaryTimer);
    summaryTimer = setTimeout(flushSummary, 600);
  }
});
document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.matches("[data-ts-date]") && UI.sheet?.params?.draft) {
    syncDraftInputs();
    UI.sheet.params.draft.dueDate = el.value || null;
    renderSheet();
  } else if (el.matches("[data-course-name]")) {
    const name = el.value.trim();
    if (name) dispatch({ t: "course.patch", id: el.dataset.courseName, patch: { name } }, { silent: true });
  } else if (el.id === "att-file") {
    const file = el.files && el.files[0];
    el.value = "";
    if (file) handleAttachFile(file);
  }
});
function renderFeedRows(feeds) {
  const el = document.getElementById("feeds-list");
  if (!el) return;
  el.innerHTML = feeds.length
    ? feeds.map((f, i) => `<div class="mgr-row" style="min-height:40px">
        <span style="flex:1;overflow-wrap:anywhere">${esc(f.name || "Calendar")}</span>
        <button class="btn-quiet" style="color:var(--danger)" data-action="cal-feed-remove" data-i="${i}" data-url="${esc(f.url)}">Remove</button>
      </div>`).join("")
    : "No calendars connected yet.";
}
async function refreshFeedsUI() {
  if (mode !== "github") { const el0 = document.getElementById("feeds-list"); if (el0) el0.textContent = "Connect sync to add calendars."; return; }
  const gen = ++feedsGen;
  const res = await loadFeeds(gen);
  if (gen !== feedsGen) return; // a save or newer refresh superseded this response
  if (UI.sheet?.kind !== "sync") return;
  if (res.error) {
    UI.sheet.params.feeds = null; // "not loaded" — the add/remove handlers refuse to write blind
    const el = document.getElementById("feeds-list");
    if (el) el.textContent = "Couldn’t load calendars — check your connection.";
    return;
  }
  UI.sheet.params.feeds = res.feeds;
  renderFeedRows(res.feeds);
}
async function handleAttachFile(file) {
  const target = UI.attachTarget; UI.attachTarget = null;
  if (!target) return;
  if (!file.type.startsWith("image/")) { toast("Only images can be attached."); return; }
  toast("Adding image…");
  try {
    const { id } = await uploadAttachment(file);
    if (target.kind === "tasksheet" && UI.sheet?.kind === "task" && UI.sheet.params.draft && UI.sheet.params.draft === target.draft) {
      syncDraftInputs();
      (target.draft.images ||= []).push(id);
      renderSheet(); hydrateThumbs(document.getElementById("sheet-root"));
      toast("Image added ✓");
    } else if (target.kind === "summary" && target.scope && parseWeekKey(target.week || "")) {
      dispatch({ t: "summary.image", weekKey: target.week, scope: target.scope, id, add: true }, { silent: true });
      render();
      toast("Image added ✓");
    }
    // a mismatched/closed sheet falls through silently: the upload stays as an accepted orphan
  } catch (err) { toast(err.userMessage || "Couldn’t add the image."); }
}
document.addEventListener("paste", (e) => {
  const file = [...((e.clipboardData && e.clipboardData.files) || [])].find(f => f.type.startsWith("image/"));
  if (!file) return;
  if (UI.sheet?.kind === "task") {
    e.preventDefault();
    if (!attachmentsAvailable()) { toast("Connect sync first — images are stored with your synced planner."); return; }
    UI.attachTarget = { kind: "tasksheet", draft: UI.sheet.params.draft || null };
    handleAttachFile(file);
  } else if (UI.editingSummary) {
    const [scope, week] = UI.editingSummary.split("|");
    e.preventDefault();
    if (!attachmentsAvailable()) { toast("Connect sync first — images are stored with your synced planner."); return; }
    UI.attachTarget = { kind: "summary", scope, week };
    handleAttachFile(file);
  }
});
// keep the summary editor's focus when its toolbar is pressed (a blur would close it)
document.addEventListener("pointerdown", (e) => {
  if (e.target.closest && e.target.closest('[data-action="md-wrap"], [data-action="att-add-summary"]')) e.preventDefault();
});
const MD_TOOLS_SEL = '[data-action="md-wrap"], [data-action="att-add-summary"]';
function teardownSummaryEditor(ta) {
  summaryPending = { scope: ta.dataset.summary, week: ta.dataset.week, text: ta.value };
  flushSummary();
  UI.editingSummary = null;
  // Defer the re-render until an in-flight tap finishes dispatching its click —
  // rebuilding the view between mousedown and mouseup would swallow that tap.
  const finish = () => { clearTimeout(tid); document.removeEventListener("click", finish, true); setTimeout(render, 0); };
  const tid = setTimeout(finish, 300);
  document.addEventListener("click", finish, true);
}
document.addEventListener("focusout", (e) => {
  const fromTextarea = e.target.matches && e.target.matches("[data-summary]");
  const fromTools = !fromTextarea && e.target.closest && e.target.closest(".md-tools");
  if (!fromTextarea && !fromTools) return;
  const ta = fromTextarea ? e.target : document.querySelector("#view textarea[data-summary]");
  if (!ta) return;
  // moving between the textarea and its toolbar keeps the editor open (keyboard access)
  if (e.relatedTarget && e.relatedTarget.closest && (e.relatedTarget === ta || e.relatedTarget.closest(MD_TOOLS_SEL))) return;
  teardownSummaryEditor(ta);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && UI.sheet) { closeSheet(); return; }
  if (e.key === "Tab" && UI.sheet) {
    const root = document.getElementById("sheet-root");
    const f = [...root.querySelectorAll("button, input, textarea, select")].filter(el => !el.disabled && el.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && (document.activeElement === first || !root.contains(document.activeElement))) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && (document.activeElement === last || !root.contains(document.activeElement))) { e.preventDefault(); first.focus(); }
  }
});
// Lift the bottom sheet above the on-screen keyboard where the embedder exposes it.
// The lift alone is not enough: without capping the sheet's height to the visible
// viewport, raising it pushes its top (and the focused field) off the screen.
if (window.visualViewport) {
  const vvHandler = () => {
    const sheet = document.querySelector("#sheet-root.open .sheet");
    if (!sheet || window.matchMedia("(min-width: 900px)").matches) return;
    const kb = Math.max(0, window.innerHeight - visualViewport.height - visualViewport.offsetTop);
    sheet.style.bottom = kb + "px";
    sheet.style.maxHeight = kb > 0 ? Math.max(200, Math.round(visualViewport.height * 0.96)) + "px" : "";
    if (kb > 0 && document.activeElement && sheet.contains(document.activeElement)) {
      try { document.activeElement.scrollIntoView({ block: "nearest" }); } catch {}
    }
  };
  visualViewport.addEventListener("resize", vvHandler);
  visualViewport.addEventListener("scroll", vvHandler);
}
document.getElementById("save-chip").addEventListener("click", () => {
  if (saveState === "error" && mode !== "readonly") { dirty = true; saveNow(); }
});

/* router */
let suppressHashRender = false;
function parseHash() {
  const m = /^#\/(home|planner|calendar|habits)(?:\/(study|work|personal))?/.exec(location.hash);
  if (!m) return;
  UI.view = m[1];
  if (m[1] === "planner" && m[2]) UI.plannerTab = m[2];
}
function navTo(view, tab) {
  UI.view = view;
  if (tab) { UI.plannerTab = tab; saveUiPrefs(); }
  const target = view === "planner" ? `#/planner/${UI.plannerTab}` : `#/${view}`;
  if (location.hash !== target) { suppressHashRender = true; try { location.hash = target; } catch {} }
  render();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", () => {
  if (suppressHashRender) { suppressHashRender = false; return; }
  parseHash(); render();
});

/* top-level render */
function render() {
  if (conflictLock || !S) return;
  flushSummary();
  const sheetRoot = document.getElementById("sheet-root");
  const focusSel = sheetRoot.contains(document.activeElement) ? null : focusSelectorFor(document.activeElement);
  renderShell();
  document.getElementById("page-title").textContent =
    UI.view === "planner" ? CAT_LABEL[UI.plannerTab] : ({ home: "Home", calendar: "Calendar", habits: "Habits" })[UI.view] || "Home";
  materializeWeek(currentWeekKey());
  if (UI.view === "planner" || UI.view === "habits") materializeWeek(UI.weekKey);
  document.getElementById("view").innerHTML = VIEWS[UI.view]();
  applyPendingDrafts();
  // Restore keyboard focus to the recreated control so tab position survives
  // re-renders and assistive tech re-announces the control's new state.
  if (focusSel && (!document.activeElement || document.activeElement === document.body)) {
    const el = document.querySelector(focusSel);
    if (el && !sheetRoot.contains(el)) el.focus({ preventScroll: true });
  }
  hydrateThumbs(document.getElementById("view"));
  updateChrome();
}
function applyPendingDrafts() {
  if (!UI.pendingDrafts) return;
  const drafts = UI.pendingDrafts; UI.pendingDrafts = null;
  let summaryRestored = false;
  const canWrite = mode !== "readonly" && mode !== "load-error" && !futureVersion;
  for (const [k, v] of Object.entries(drafts)) {
    if (k.startsWith("sum:") && typeof v === "string" && canWrite) {
      const [scope, week] = k.slice(4).split("|");
      if (scope && parseWeekKey(week || "")) {
        try { dispatch({ t: "summary.set", weekKey: week, scope, text: v }, { silent: true }); summaryRestored = true; } catch {}
      }
    }
  }
  if (summaryRestored) document.getElementById("view").innerHTML = VIEWS[UI.view]();
  for (const [k, v] of Object.entries(drafts)) {
    if (!k.startsWith("sum:") && typeof v === "string") {
      const el = document.querySelector(`[data-draft-id="${CSS.escape(k)}"]`);
      if (el) el.value = v;
    }
  }
}

boot();
